services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: scansuite_db
      POSTGRES_USER: scansuite
      POSTGRES_PASSWORD: password123 # Should be updated in .env
    ports:
      - "5432:5432"
    volumes:
      - psql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scansuite -d scansuite_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "4100:4000"
    env_file: .env.production
    environment:
      - DATABASE_URL=postgresql://scansuite:password123@postgres:5432/scansuite_db
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "3100:3000"
    env_file: .env.production
    environment:
      - NEXT_PUBLIC_API_URL=https://scansuite.co.zw/api
    depends_on:
      - api

volumes:
  psql_data:
